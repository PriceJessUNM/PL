<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Psychological Literacy Safari Escape Room</title><style>body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff}#game{min-height:100vh}.screen{display:none;padding:20px;min-height:100vh;background-size:cover;background-position:center}.active{display:block}.panel{background:rgba(0,0,0,.7);padding:20px;border-radius:10px;max-width:900px}.btn{padding:10px 18px;margin:5px;background:#d4a017;border:none;border-radius:6px;cursor:pointer}.status{position:fixed;top:0;left:0;right:0;background:#222;padding:8px;display:flex;gap:20px;z-index:5}.card{padding:15px;background:#333;margin:10px;border-radius:8px;display:inline-block}.locked{opacity:.5}img.frag{width:200px}input[type=text]{padding:8px}label{display:block;margin:6px 0}@media(max-width:700px){img.frag{width:140px}}</style></head><body><div class="status"><span id=timer>20:00</span><span id=life>Life:100</span><button class=btn onclick='toggleMute()'>Mute/Unmute</button></div><div id=game></div><audio id=bg loop src='assets/background_music.mp3'></audio><audio id=correct src='assets/correct.mp3'></audio><audio id=incorrect src='assets/incorrect.mp3'></audio><audio id=found src='assets/document_found.mp3'></audio><audio id=unlock src='assets/door_unlock.mp3'></audio><script>let life=100,time=1200,r1=false,r2=false,u3=false,muted=false;function play(id){let a=document.getElementById(id);if(!muted)a.play().catch(()=>{});}function toggleMute(){muted=!muted;document.querySelectorAll('audio').forEach(a=>a.muted=muted)};function screen(h,bg=''){document.getElementById('game').innerHTML='<div class="screen active" style="background-image:url('+bg+')">'+h+'</div>'}function start(){document.getElementById('bg').play().catch(()=>{});instructions()}function instructions(){screen('<div class=panel><h1>Instructions</h1><p>Complete Rooms 1 and 2 in any order. Each gives a fragment. Reconstruct the code, unlock Room 3 and finish the challenge. Timer 20 minutes. Incorrect answers lose 10 life points.</p><button class=btn onclick=map()>Continue</button></div>')}function map(){let fr='';if(r1)fr+='<img class=frag src=assets/fragment1.png>';if(r2)fr+='<img class=frag src=assets/fragment2.png>';if(r1&&r2)fr+='<div><p>Accessible clue: Fragments combine to reveal code 1742.</p><input id=code maxlength=4><button class=btn onclick=unlockRoom()>Unlock Room 3</button></div>';screen('<div class=panel><h1>Map</h1><div class=card><button class=btn onclick=room1()>Room 1 '+(r1?'✓':'')+'</button></div><div class=card><button class=btn onclick=room2()>Room 2 '+(r2?'✓':'')+'</button></div><div class="card '+(u3?'':'locked')+'"><button class=btn '+(u3?'':'disabled')+' onclick=room3()>Room 3</button></div><h3>Fragments</h3>'+fr+'</div>')}function unlockRoom(){if(document.getElementById('code').value==='1742'){u3=true;play('unlock');alert('Room 3 unlocked');map()}else alert('Incorrect code')}function lifeLoss(){life-=10;document.getElementById('life').textContent='Life:'+life;if(life<=0)gameover()}function room1(){screen('<div class=panel><h2>Room 1</h2><p>Psychological literacy refers to:</p><button class=btn onclick="q1(true)">Using psychological knowledge and skills to understand and improve real-world situations</button><button class=btn onclick="q1(false)">Other option</button><div id=fb></div></div>','assets/room1.png')}function q1(c){if(c){play('correct');document.getElementById('fb').innerHTML='Correct. Psychological literacy involves applying knowledge. <br><button class=btn onclick=r1done()>Next</button>';}else{play('incorrect');lifeLoss();document.getElementById('fb').innerHTML='Incorrect. Try again.';}}function r1done(){r1=true;play('found');screen('<div class=panel><h2>Fragment Found</h2><img class=frag src=assets/fragment1.png><br><button class=btn onclick=map()>Back to Map</button></div>','assets/room1.png')}function room2(){screen('<div class=panel><h2>Room 2</h2><p>Which skills are developed through psychology? Select all correct.</p><label><input type=checkbox id=a checked disabled>Critical thinking</label><label><input type=checkbox checked disabled>Data analysis</label><button class=btn onclick=r2done()>Submit</button></div>','assets/room2.png')}function r2done(){r2=true;play('found');screen('<div class=panel><h2>Fragment Found</h2><img class=frag src=assets/fragment2.png><br><button class=btn onclick=map()>Back to Map</button></div>','assets/room2.png')}function room3(){screen('<div class=panel><h2>Final Challenge</h2><p>What is the best description of a psychologically literate graduate?</p><button class=btn onclick=finish(true)>Uses knowledge and skills to benefit self, others and society</button><button class=btn onclick=finish(false)>Other</button></div>','assets/room3.png')}function finish(c){if(c){play('correct');screen('<div class=panel><h1>Congratulations</h1><p>You completed the safari expedition.</p><button class=btn onclick=restart()>Restart</button></div>','assets/room3.png')}else{play('incorrect');lifeLoss();}}function gameover(){screen('<div class=panel><h1>Game Over</h1><button class=btn onclick=restart()>Restart</button></div>')}function restart(){life=100;time=1200;r1=r2=u3=false;document.getElementById('life').textContent='Life:100';home()}setInterval(()=>{time--;let m=Math.floor(time/60),s=time%60;document.getElementById('timer').textContent=(m+':'+String(s).padStart(2,'0'));if(time<=0)gameover();},1000);function home(){screen('<div class=panel><h1>Lost Journal of Psychological Literacy</h1><p>Safari expedition storyline.</p><button class=btn onclick=start()>Start</button></div>','assets/cover.png')}home();</script></body></html>
